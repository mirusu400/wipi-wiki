name: Deploy WIPI Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for git-revision plugin if added later

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Generate llms.txt / llms-full.txt
        run: python3 scripts/build_llms_txt.py site

      # Optional: Pagefind index for better CJK search. Drop the leading "#"
      # to enable. Pair with a custom search override in docs/overrides/ to
      # actually use the index in the UI.
      # - name: Set up Node (for Pagefind)
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: "20"
      # - name: Build Pagefind index
      #   run: npx -y pagefind --site site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
